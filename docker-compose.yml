services:
  web:
    build: .
    # image: ashish1106/bopo:v1
    command: "daphne -b 0.0.0.0 -p 8000 bopo_backend.asgi:application"
    ports:
      - "8001:8000"
    # env_file: .env
    volumes:
      - .:/app 
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - DEBUG=True
      - DB_NAME=my_django_db
      - DB_USER=django_user
      - DB_PASSWORD=NewPassword
      # - DB_HOST=127.0.0.1
      # - DB_HOST=172.17.0.1
      - DB_HOST=host.docker.internal
        # DB_HOST=127.17.0.1
        # DB_HOST=host.docker.internal
      - DB_PORT=3305


      - TWILIO_ACCOUNT_SID=ACacaecf422d9f93836e549cbd3adde231
      - TWILIO_AUTH_TOKEN=3584b709694fe03abfefac57ec19d2cf
      - TWILIO_PHONE_NUMBER=+19379091558

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"