name: CI/CD - Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ashish1106/bopo

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get tag or short commit hash
        id: vars
        run: |
          TAG=$(git describe --tags --exact-match 2>/dev/null || echo "sha-$(git rev-parse --short HEAD)")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ steps.vars.outputs.tag }} .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ steps.vars.outputs.tag }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/oracle/biggbonuspoints

            sed -i 's|image: ashish1106/bopo:.*|image: ashish1106/bopo:${{ steps.vars.outputs.tag }}|' docker-compose.yml

            docker-compose pull
            docker-compose down
            docker-compose up -d
